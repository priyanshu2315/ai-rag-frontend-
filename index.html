<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ask questions about your own documents." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>DocuMind</title>

    <!-- Theme before first paint (see src/hooks/useTheme.js). Waiting for the
         bundle would show dark-mode users a white flash on every load. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('documind:theme');
          document.documentElement.classList.toggle('dark', stored !== 'light');
        } catch (e) {}
      })();
    </script>

    <!-- Runtime config (§17). Must load before the bundle so `constants/env.js`
         can read window.__ENV__. In dev this file is an empty placeholder. -->
    <script src="/env.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
